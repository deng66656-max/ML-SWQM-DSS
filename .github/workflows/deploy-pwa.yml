name: Deploy ML-SWQM-DSS PWA

on:
  push:
    branches:
      - main
    paths:
      - "pwa/**"
      - "static/icons/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare PWA
        run: |
          mkdir -p _site/static/icons
          cp pwa/index.html _site/index.html
            cp pwa/service-worker.js _site/service-worker.js
          cp pwa/manifest.json _site/manifest.json
          cp static/icons/icon-192.png _site/static/icons/icon-192.png
          cp static/icons/icon-512.png _site/static/icons/icon-512.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

